<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div{
            display: inline-block;
            height: 200px;
            width: 200px;
            background-color: beige;
        }
        .divc{
            display: inline-block;
            height: 200px;
            width: 200px;
            background-color: cadetblue;
        }

        .div1:hover{
            background-color: aqua;
            cursor: help;
        }
        .div2{
            cursor: progress;
        }
        .div3{
            cursor: wait;
        }
        .dis{
            /* display none usko hata dega */
            display: none;
        }
        .vis{
            /* wrritten nhi dikhega lekin uski space hogi */
            visibility: hidden;
        }
    </style>
</head>
<body>
    <!-- div i block tag we can apply height width and if e dont it occupies the parent space present  -->
    <!-- inline property jitna likha hai utni space consume karega -->
    <!-- inline block me same line + height width -->
    <div class="div">1</div>
    <div class="div">2</div>
    <div class="div">3</div>

    <hr size="10 " color="black">

    <div class="div1 divc">help</div>
    <div class="div2 divc">process</div>
    <div class="div3 divc">wait</div>

    <hr size="10 " color="black">
    <div>1</div>
    <div>2</div>
    <div class="dis">3</div>
    <div>4</div>
    <div class="vis">5</div>
    <div>6</div>
</body>
</html>
