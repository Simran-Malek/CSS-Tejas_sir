<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    /* selector */
    /* 4 types */
    /* 1. tag based */
    h1{
        color: brown;
    }
    /* 2. class based*/
    .h1{
       color: aquamarine
    }
    /* 3.id based */
    #h1{
       color: burlywood;
    }
    /* 4. universal */
    *{
        border: dotted;
    }
    body{
        border: none;
    }
    html{
        border: none;
    }
    </style>
</head>
<body>
    <h1>CSS</h1>
    <h1 class="h1">HMT</h1>
    <h1 id="h1">25-04-2026</h1>
</body>
</html>
