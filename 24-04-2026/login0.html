<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:rgb(1, 126, 101);
        }
        .container{
            background-color:beige;
            height: 500px;
            width: 500px;
            text-align: center;
            /* margin-left: 430px;
            margin-top: 120px; */
            margin: auto;
            border-radius: 10px;
        }
        .login-container{
            background-color:rgb(8, 196, 152);
            height:80px;
            padding: 15px;
            border-radius: 5px;
        }
        input{
            height: 30px;
            width: 320px;
            border: solid 1px antiquewhite;
            border-radius: 5px;
            border-color: black;
        }
        button{
            height: 30px;
            width: 250px;
            border-radius: 5px;
            background-color: rgb(8, 196, 152);
            font-size: large;
        }
        a{
            text-decoration: none;
            color: rgb(8, 196, 152);
            font-size: larger;  
        }
        .form-container{
            margin-top: 15px;
        }
        span{
            color: rgb(74, 107, 100);
            font-size: larger;
        }
    </style>
</head>
<body >
        <div class="container">

            <div class="login-container">
                <h1>Login Form</h1>
            </div>

            <div class="form-container">
                <form>
                    <input type="text" name="email" placeholder="Email or Phone"><br><br>
                    <input type="password" name="password" placeholder="Password"><br><br>
                    <a href="#">Forgot Password?</a><br><br>
                    <button type="submit">Login</button><br><br>
                    <span>Not a member?</span>&nbsp;<a href="#">Signup now</a>
                </form>
            </div>
        </div>
</body>
</html>
