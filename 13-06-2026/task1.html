<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img1{
            border-radius: 15px;
        }
        .img2{
            border-radius: 50%;
        }
        .img3{
            border-radius: 50%;
            width: 100px;
            height: 100px;
        }
        .img4{
            border-radius: 15px;
            border: 8px solid black;
        }
        .img5{
            filter: blur(5px);
        }
        .img6{
            filter: invert(10);
        }
        .img7{
            filter: saturate(10);
        }
        .img8{
            filter: sepia(100%);
        }
        .img9{
            box-shadow: 0 4px 8px 0 grey,0 8px 16px 0 black;
        }

    </style>
</head>
<body>
    <div>
        <img class="img1" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img2" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img3" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img4" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img5" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img6" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img7" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img8" src="./virat kohli.jpg" alt="virat">
    </div>
    <div>
        <img class="img9" src="./virat kohli.jpg" alt="virat">
    </div>
    
</body>
</html>
